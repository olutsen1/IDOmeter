<text x="322" y="846" fill="#6a1b9a" font-size="12">4 SPI lines: 27→MISO, 26→MOSI, 25→SCK, 33→CS</text>
<text x="1000" y="710" font-weight="bold" fill="#333" font-size="13">Notes</text>
<text x="1000" y="730"  fill="#333" font-size="13">• Grove GSR runs on 3.3 V: its output</text>
<text x="1000" y="750"  fill="#333" font-size="13">  stays within the ADC input range.</text>
<text x="1000" y="770"  fill="#333" font-size="13">• ADS1115: VDD on 3V3, never 5V.</text>
<text x="1000" y="790"  fill="#333" font-size="13">• A1–A3 free (A1: breathing, later).</text>
<text x="1000" y="810"  fill="#333" font-size="13">• GPIO36 can stay connected to SIG.</text>
<text x="1000" y="830"  fill="#333" font-size="13">• Lines crossing without a dot</text>
<text x="1000" y="850"  fill="#333" font-size="13">  are not connected.</text>
</svg>